<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista com DOM</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f5f5f5;
            padding:20px;
        }

        .container{
            max-width:900px;
            margin:auto;
        }

        h1{
            text-align:center;
            margin-bottom:20px;
        }

        .formulario{
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        .formulario input,
        .formulario textarea{
            width:100%;
            padding:10px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            background:#007bff;
            color:white;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#0056b3;
        }

        .lista{
            margin-top:30px;
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
        }

        .card{
            background:white;
            padding:15px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.1);
        }

        .card img{
            width:100%;
            height:180px;
            object-fit:cover;
            border-radius:8px;
            margin-top:10px;
        }

        .card h3{
            margin-bottom:10px;
        }

        .card p{
            color:#555;
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>Lista de Cursos</h1>

        <div class="formulario">
            <input type="text" id="titulo" placeholder="Título">

            <textarea id="descricao"
                placeholder="Descrição"></textarea>

            <input type="text" id="imagem"
                placeholder="URL da Imagem">

            <button onclick="adicionarItem()">
                Adicionar
            </button>
        </div>

        <div class="lista" id="lista"></div>

    </div>

    <script>
        function adicionarItem(){

            const titulo =
                document.getElementById("titulo").value;

            const descricao =
                document.getElementById("descricao").value;

            const imagem =
                document.getElementById("imagem").value;

            if(
                titulo === "" ||
                descricao === "" ||
                imagem === ""
            ){
                alert("Preencha todos os campos!");
                return;
            }

            const card =
                document.createElement("div");

            card.classList.add("card");

            const h3 =
                document.createElement("h3");

            h3.textContent = titulo;

            const p =
                document.createElement("p");

            p.textContent = descricao;

            const img =
                document.createElement("img");

            img.src = imagem;
            img.alt = titulo;

            card.appendChild(h3);
            card.appendChild(p);
            card.appendChild(img);

            document
                .getElementById("lista")
                .appendChild(card);

            document.getElementById("titulo").value = "";
            document.getElementById("descricao").value = "";
            document.getElementById("imagem").value = "";
        }
    </script>

</body>
</html>
